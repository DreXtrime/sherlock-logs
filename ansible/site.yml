---
- name: Base provisioning
  hosts: all
  become: yes
  roles:
    - common
    - docker
    - monitoring_agents

- name: Load balancer
  hosts: loadbalancers
  become: yes
  roles:
    - loadbalancer

- name: Web servers
  hosts: webservers
  become: yes
  roles:
    - webserver

- name: App server
  hosts: appservers
  become: yes
  roles:
    - appserver

- name: Monitor
  hosts: monitors
  become: yes
  roles:
    - monitor