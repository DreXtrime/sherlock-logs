# Accept logs from Filebeat agents running on all VMs
input {
  beats {
    port => 5044
  }
}

filter {
  # If the log has a container name field, it came from a Docker container
  if [container][name] {
    mutate {
      add_field => { "log_type" => "docker" }
    }
  # If the log came from /var/log, it's a system log
  } else if [log][file][path] =~ "/var/log" {
    mutate {
      add_field => { "log_type" => "system" }
    }
  # Anything else is treated as an application log
  } else {
    mutate {
      add_field => { "log_type" => "application" }
    }
  }

  # Tag log entries containing FATAL for alerting
  if [message] =~ "FATAL" {
    mutate {
      add_tag => ["fatal_alert"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{log_type}-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Send notification to Discord when a FATAL log is detected
  if "fatal_alert" in [tags] {
    http {
      url => "YOUR_DISCORD_WEBHOOK_URL"
      http_method => "post"
      format => "json"
      mapping => {
        "content" => "FATAL detected on %{[host][name]}: %{message}"
      }
    }
  }
}